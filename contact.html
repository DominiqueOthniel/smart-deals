<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact | Smart Deals Cameroun</title>
  <link rel="icon" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Manrope:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="contactTitle">Parlez nous</h1>
      <p data-i18n="contactSub">Francais et anglais. WhatsApp est le plus rapide.</p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-wrap">
      <div class="contact-card info-list">
        <p><strong data-i18n="address">Hotel Beau Sejour, Akwa, 3e niveau, porte 302, Douala</strong></p>
        <p>+237 670 000 000</p>
        <p>hello@smartdeals.cm</p>
        <p data-i18n="hours">Lun a Sam, 8h30 a 19h00</p>
        <a class="btn btn-gold" href="https://wa.me/237670000000" target="_blank" rel="noopener" data-i18n="whatsapp">WhatsApp</a>
      </div>
      <form class="form-card" id="contact-form">
        <div class="field">
          <label for="c-name" data-i18n="fullName">Nom complet</label>
          <input id="c-name" required>
        </div>
        <div class="field">
          <label for="c-phone" data-i18n="phone">Numero de telephone</label>
          <input id="c-phone" required>
        </div>
        <div class="field">
          <label for="c-email" data-i18n="email">Email</label>
          <input id="c-email" type="email">
        </div>
        <div class="field">
          <label for="c-msg" data-i18n="message">Message</label>
          <textarea id="c-msg" rows="5" required></textarea>
        </div>
          <button class="btn btn-gold" type="submit" data-i18n="send">Envoyer</button>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>

  <script>window.SD_PAGE = "contact.html";</script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        node.textContent = t(node.getAttribute("data-i18n"));
      });
    });
  </script>
</body>
</html>

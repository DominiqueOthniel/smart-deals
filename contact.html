<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Smart Deals Cameroon</title>
  <link rel="icon" href="assets/images/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1 data-i18n="contactTitle">Talk to us</h1>
      <p data-i18n="contactSub">English and French. WhatsApp is fastest.</p>
    </div>
  </section>

  <section class="section">
    <div class="container contact-wrap">
      <div class="contact-card info-list">
        <p><strong data-i18n="address">Bonanjo, Douala, Cameroon</strong></p>
        <p>+237 670 000 000</p>
        <p>hello@smartdeals.cm</p>
        <p data-i18n="hours">Mon to Sat, 8:30 to 19:00</p>
        <a class="btn btn-gold" href="https://wa.me/237670000000" target="_blank" rel="noopener" data-i18n="whatsapp">WhatsApp us</a>
      </div>
      <form class="form-card" id="contact-form">
        <div class="field">
          <label for="c-name" data-i18n="fullName">Full name</label>
          <input id="c-name" required>
        </div>
        <div class="field">
          <label for="c-phone" data-i18n="phone">Phone number</label>
          <input id="c-phone" required>
        </div>
        <div class="field">
          <label for="c-email" data-i18n="email">Email</label>
          <input id="c-email" type="email">
        </div>
        <div class="field">
          <label for="c-msg" data-i18n="message">Message</label>
          <textarea id="c-msg" rows="5" required></textarea>
        </div>
        <button class="btn btn-gold" type="submit" data-i18n="send">Send message</button>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>

  <script>window.SD_PAGE = "contact.html";</script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/pages.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("[data-i18n]").forEach(function (node) {
        node.textContent = t(node.getAttribute("data-i18n"));
      });
    });
  </script>
</body>
</html>
